# PBY Queue: one container (Node server + SQLite + the built PWA).
# Copy .env.example to .env and fill it in, then: docker compose up -d
services:
  pby-queue:
    build: .
    image: pby-queue:latest
    container_name: pby-queue
    restart: unless-stopped
    ports:
      - '${HOST_PORT:-3000}:3000'
    env_file: .env
    environment:
      DATABASE_PATH: /data/pby-queue.db
    volumes:
      # The SQLite file lives here. Back it up only if you want to (backups extend retention).
      - pby-data:/data

volumes:
  pby-data:
